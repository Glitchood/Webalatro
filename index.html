    <center>
      <div>
        <canvas id="loadingCanvas" oncontextmenu="event.preventDefault()" width="800" height="600"></canvas>
        <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
      </div>
    </center>

    <script type='text/javascript'>
        function isFullscreenActive() {
          return !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
        }

        function requestElementFullscreen(el) {
          if (!el) return null;
          if (el.requestFullscreen) return el.requestFullscreen();
          if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
          if (el.mozRequestFullScreen) return el.mozRequestFullScreen();
          if (el.msRequestFullscreen) return el.msRequestFullscreen();
          if (el.requestFullScreen) return el.requestFullScreen();
          return null;
        }

        function toggleFullscreen() {
          if (isFullscreenActive()) {
            try { if (document.exitFullscreen) document.exitFullscreen(); } catch (e) {}
            try { if (document.webkitExitFullscreen) document.webkitExitFullscreen(); } catch (e) {}
            try { if (document.mozCancelFullScreen) document.mozCancelFullScreen(); } catch (e) {}
          } else {
            goFullScreen();
          }
        }

        (function guardGameCanvasFullscreen() {
          function swallowGameCanvas(proto, key) {
            var orig = proto[key];
            if (!orig) return;
            proto[key] = function (options) {
              if (this && (this.id === 'canvas' || this.id === 'loadingCanvas')) {
                return new Promise(function() {});
              }
              return orig.call(this, options);
            };
          }
          swallowGameCanvas(Element.prototype, 'requestFullscreen');
          swallowGameCanvas(Element.prototype, 'webkitRequestFullscreen');
          swallowGameCanvas(Element.prototype, 'mozRequestFullScreen');
          swallowGameCanvas(Element.prototype, 'msRequestFullscreen');
        })();

        window.addEventListener('keydown', function (e) {
          if (e.key === 'f' || e.key === 'F') {
            if (e.repeat) return;
            if (!e.target || (e.target && e.target.tagName && e.target.tagName.toLowerCase() === 'input')) return;
            toggleFullscreen();
          }
        });

        function goFullScreen(){
              if (document.documentElement) document.documentElement.focus();
              if (isFullscreenActive()) return;

              var requestPromise = requestElementFullscreen(document.documentElement);
              if (requestPromise && requestPromise.catch) {
                requestPromise.catch(function(err){
                  console.debug('Fullscreen request failed', err);
                });
              }
        }

      // Virtual cursor system for pointer lock
      var virtualCursor = {
        x: 0,
        y: 0,
        locked: false,
        canvas: null,
        lastUpdateTime: 0
      };

      function initVirtualCursor() {
        virtualCursor.canvas = document.getElementById("canvas");
        
        // Initialize position to center
        var rect = virtualCursor.canvas.getBoundingClientRect();
        virtualCursor.x = rect.width / 2;
        virtualCursor.y = rect.height / 2;

        // Request pointer lock only when already in fullscreen to avoid conflicting with fullscreen gesture.
        virtualCursor.canvas.addEventListener('click', function() {
          if (!isFullscreenActive() || virtualCursor.locked) return;
          virtualCursor.canvas.requestPointerLock = virtualCursor.canvas.requestPointerLock ||
                                                     virtualCursor.canvas.mozRequestPointerLock ||
                                                     virtualCursor.canvas.webkitRequestPointerLock;
          if (virtualCursor.canvas.requestPointerLock) {
            try { virtualCursor.canvas.requestPointerLock(); } catch (_) {}
          }
        });

        // Listen for pointer lock changes
        document.addEventListener('pointerlockchange', lockChangeAlert, false);
        document.addEventListener('mozpointerlockchange', lockChangeAlert, false);
        document.addEventListener('webkitpointerlockchange', lockChangeAlert, false);

        // Handle mouse movement when locked
        document.addEventListener('mousemove', function(e) {
          if (virtualCursor.locked) {
            var rect = virtualCursor.canvas.getBoundingClientRect();
            
            // Update virtual cursor position with movement deltas
            virtualCursor.x += e.movementX;
            virtualCursor.y += e.movementY;

            // Clamp to canvas bounds
            virtualCursor.x = Math.max(0, Math.min(rect.width, virtualCursor.x));
            virtualCursor.y = Math.max(0, Math.min(rect.height, virtualCursor.y));

            // Throttle updates to ~60fps
            var now = Date.now();
            if (now - virtualCursor.lastUpdateTime > 16) {
              virtualCursor.lastUpdateTime = now;
            }
          }
        }, false);
        
        console.log('Virtual cursor system initialized');
      }

      function lockChangeAlert() {
        var canvas = virtualCursor.canvas;
        if (document.pointerLockElement === canvas ||
            document.mozPointerLockElement === canvas ||
            document.webkitPointerLockElement === canvas) {
          console.log('Pointer locked - virtual cursor enabled');
          virtualCursor.locked = true;
          canvas.style.cursor = 'none';
        } else {
          console.log('Pointer unlocked - virtual cursor disabled');
          virtualCursor.locked = false;
          canvas.style.cursor = 'none';
        }
      }

      function onFullscreenChanged() {
        syncCanvasSizes();
        setTimeout(syncCanvasSizes, 80);
        setTimeout(syncCanvasSizes, 250);
        pollAudioUnlock();
        if (!isFullscreenActive()) {
          virtualCursor.locked = false;
          if (virtualCursor.canvas) virtualCursor.canvas.style.cursor = 'none';
        }
        try { afterTransitionDump('fullscreenchange'); } catch (e) {}
      }

      // Audio unlock overlay for browsers that block autoplay
      var audioUnlock = {
        overlay: null,
        ctx: null,
        unlocked: false,
        userInteracted: false,
        firstInteractionAt: 0
      };

      function hideAudioUnlockOverlay() {
        if (audioUnlock.overlay) {
          try { audioUnlock.overlay.style.display = 'none'; } catch(e){}
        }
      }

      function createAudioUnlockOverlay() {
        if (audioUnlock.unlocked) return;
        if (audioUnlock.overlay) {
          try { audioUnlock.overlay.style.display = 'flex'; } catch (e) {}
          return;
        }
        if (finalizeAudioUnlockIfReady()) return;
        try {
          audioUnlock.overlay = document.createElement('div');
          audioUnlock.overlay.id = 'audio-unlock-overlay';
          audioUnlock.overlay.style.position = 'fixed';
          audioUnlock.overlay.style.left = 0;
          audioUnlock.overlay.style.top = 0;
          audioUnlock.overlay.style.width = '100%';
          audioUnlock.overlay.style.height = '100%';
          audioUnlock.overlay.style.display = 'flex';
          audioUnlock.overlay.style.alignItems = 'center';
          audioUnlock.overlay.style.justifyContent = 'center';
          audioUnlock.overlay.style.background = 'rgb(18, 18, 18)';
          audioUnlock.overlay.style.color = 'white';
          audioUnlock.overlay.style.fontFamily = 'sans-serif';
          audioUnlock.overlay.style.fontSize = '20px';
          audioUnlock.overlay.style.zIndex = 999999;
          audioUnlock.overlay.style.cursor = 'pointer';
          audioUnlock.overlay.innerText = 'Click or press any key to start';
          audioUnlock.overlay.addEventListener('click', unlockAudioOnce);
          document.body.appendChild(audioUnlock.overlay);
  } catch (e) { }
      }

      function collectAudioContexts() {
        var contexts = [];
        try {
          if (window.Module && Module.SDL2 && Module.SDL2.audioContext) {
            contexts.push(Module.SDL2.audioContext);
          }
        } catch (e) { }
        try {
          if (window.AL && AL.currentCtx && AL.currentCtx.audioCtx) {
            contexts.push(AL.currentCtx.audioCtx);
          }
          if (window.AL && AL.sharedCaptureAudioCtx) {
            contexts.push(AL.sharedCaptureAudioCtx);
          }
        } catch (e) { }
        return contexts;
      }

      function finalizeAudioUnlockIfReady() {
        var contexts = collectAudioContexts();
        var hasReadyContext = false;
        for (var i = 0; i < contexts.length; i++) {
          var ctx = contexts[i];
          if (ctx && ctx.state !== 'suspended') {
            hasReadyContext = true;
            break;
          }
        }

        if (!hasReadyContext) {
          var now = Date.now();
          if (audioUnlock.userInteracted && audioUnlock.firstInteractionAt > 0 && (now - audioUnlock.firstInteractionAt) > 2500) {
            hasReadyContext = true;
          }
        }

        if (!hasReadyContext) return false;

        audioUnlock.unlocked = true;
        hideAudioUnlockOverlay();
        window.removeEventListener('click', unlockAudioOnce);
        window.removeEventListener('keydown', unlockAudioOnce);
        window.removeEventListener('touchstart', unlockAudioOnce);
        return true;
      }

      function unlockAudioOnce(e) {
        if (audioUnlock.unlocked) return;
        if (!audioUnlock.userInteracted) {
          audioUnlock.userInteracted = true;
          audioUnlock.firstInteractionAt = Date.now();
        }
        try {
          var contexts = collectAudioContexts();
          for (var i = 0; i < contexts.length; i++) {
            var ctx = contexts[i];
            if (ctx && ctx.state === 'suspended' && typeof ctx.resume === 'function') {
              ctx.resume().then(function(){ finalizeAudioUnlockIfReady(); }).catch(function(err){ });
            }
          }
        } catch (err) { }

        finalizeAudioUnlockIfReady();
      }

      function pollAudioUnlock() {
        if (audioUnlock.unlocked) return;
        try {
          unlockAudioOnce();
          if (!audioUnlock.unlocked && audioUnlock.userInteracted) {
            createAudioUnlockOverlay();
          }
        } catch (_) {}
      }

      // Attach global listeners to unlock audio on first user gesture
      window.addEventListener('click', unlockAudioOnce);
      window.addEventListener('keydown', unlockAudioOnce);
      window.addEventListener('touchstart', unlockAudioOnce);
      setInterval(pollAudioUnlock, 1000);
      // Create overlay after a short delay so it doesn't block immediate interactions
      setTimeout(function() { createAudioUnlockOverlay(); }, 500);
      function styleBox(el, width, height, left, top) {
        if (!el) { return; }
        el.style.setProperty('width', width + 'px', 'important');
        el.style.setProperty('height', height + 'px', 'important');
        el.style.setProperty('left', left + 'px', 'important');
        el.style.setProperty('top', top + 'px', 'important');
      }

      function viewportDimensions() {
        var fsEl = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || null;
        if (fsEl) {
          var fw = fsEl.clientWidth, fh = fsEl.clientHeight;
          if (fw > 0 && fh > 0) return [Math.round(fw), Math.round(fh)];
        }
        var iw = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth || 800;
        var ih = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight || 600;
        return [Math.max(1, iw || 0), Math.max(1, ih || 0)];
      }

      function syncCanvasSizes() {
        var dims = viewportDimensions();
        var vw = Math.round(dims[0]);
        var vh = Math.round(dims[1]);
        if (vw <= 0 || vh <= 0) return;
        var loadingCanvasEl = document.getElementById('loadingCanvas');
        if (loadingCanvasEl) {
          if (loadingCanvasEl.width !== vw) loadingCanvasEl.width = vw;
          if (loadingCanvasEl.height !== vh) loadingCanvasEl.height = vh;
          styleBox(loadingCanvasEl, vw, vh, 0, 0);
        }
        var c = document.getElementById('canvas');
        if (!c || c.clientWidth <= 0) return;
        var bw = (c.width > 0) ? c.width : 300;
        var bh = (c.height > 0) ? c.height : 150;
        var bAspect = bw / bh;
        var vAspect = vw / vh;
        var w = vw, h = vh;
        if (Math.abs(bAspect - vAspect) / vAspect > 0.08) {
          if (bAspect > vAspect) {
            w = vw;
            h = Math.max(1, Math.round(vw / bAspect));
          } else {
            h = vh;
            w = Math.max(1, Math.round(vh * bAspect));
          }
        }
        var left = Math.max(0, Math.round((vw - w) / 2));
        var top = Math.max(0, Math.round((vh - h) / 2));
        if (c.clientWidth !== w || c.clientHeight !== h ||
            Math.abs(c.getBoundingClientRect().left - left) > 0.5 ||
            Math.abs(c.getBoundingClientRect().top - top) > 0.5) {
          styleBox(c, w, h, left, top);
        }
      }
      setInterval(syncCanvasSizes, 250);
      var loveReconciled = false;
      function ensureLoveBootResize() {
        if (loveReconciled) return;
        var c = document.getElementById('canvas');
        if (!c) return;
        if (typeof Module === 'undefined' || !Module || Module.canvas !== c) return;
        loveReconciled = true;
        try { syncCanvasSizes(); } catch (e) {}
        try { afterTransitionDump('boot-reconcile'); } catch (e) {}
      }
      setInterval(ensureLoveBootResize, 500);
      setTimeout(ensureLoveBootResize, 2000);
      setTimeout(ensureLoveBootResize, 6000);
      function afterTransitionDump(tag) {
        setTimeout(function () {
          try { if (window.__webalatroDump) window.__webalatroDump(tag); } catch (e) {}
        }, 250);
      }
      window.__webalatroDump = function (tag) {
        var c = document.getElementById('canvas');
        var r = c ? c.getBoundingClientRect() : null;
        var fsEl = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || null;
        var info = {
          tag: tag || 'manual',
          fs: fsEl ? fsEl.tagName : null,
          fsClient: fsEl ? Math.round(fsEl.clientWidth) + 'x' + Math.round(fsEl.clientHeight) : null,
          docClient: Math.round(document.documentElement.clientWidth) + 'x' + Math.round(document.documentElement.clientHeight),
          inner: window.innerWidth + 'x' + window.innerHeight,
          screen: (window.screen ? window.screen.width + 'x' + window.screen.height : 'n/a'),
          dpr: window.devicePixelRatio,
          canvasAttr: c ? c.width + 'x' + c.height : null,
          canvasBox: r ? Math.round(r.width) + 'x' + Math.round(r.height) : null,
          canvasStyle: c ? (c.style.width || '(none)') : null,
          canvasNative: (typeof Module !== 'undefined' && Module && Module.canvas && Module.canvas.widthNative !== undefined) ? (Module.canvas.widthNative + 'x' + Module.canvas.heightNative) : 'n/a',
          sharedPtr: (c && c.canvasSharedPtr !== undefined) ? c.canvasSharedPtr : null,
          heap32: (typeof Module !== 'undefined' && Module && Module.HEAP32) ? true : false,
          loveReady: typeof Module !== 'undefined' && !!Module && Module.canvas === c
        };
        try { console.log('[webalatro] ' + JSON.stringify(info)); } catch (e) {}
        return info;
      }
      function chaseFullscreen() {
        var c = document.getElementById('canvas');
        var fsEl = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || null;
        if (c && fsEl) {
          syncCanvasSizes();
        }
        requestAnimationFrame(chaseFullscreen);
      }
      chaseFullscreen();

      window.addEventListener('resize', function () { try { syncCanvasSizes(); } catch (e) {} });
      window.addEventListener('orientationchange', function () { try { syncCanvasSizes(); } catch (e) {} });
      document.addEventListener('fullscreenchange', onFullscreenChanged);
      document.addEventListener('webkitfullscreenchange', onFullscreenChanged);
      document.addEventListener('mozfullscreenchange', onFullscreenChanged);
      document.addEventListener('MSFullscreenChange', onFullscreenChanged);
      syncCanvasSizes();
      // ---- Webalatro web loader (DOM overlay, replaces the stock canvas loading text) ----
      var webLoader = { phase: 'start', started: false, loaded: 0, total: 0, fromCache: null, finished: false, mainStarted: false };
      function webLoaderCreate() {
        var el = document.getElementById('balatroLoader');
        if (el) return el;
        el = document.createElement('div');
        el.id = 'balatroLoader';
        el.innerHTML =
          '<div class="wl-inner">' +
            '<div id="wlStatus" class="wl-status">Click to Start</div>' +
            '<div class="wl-bar"><div id="wlFill" class="wl-fill"></div></div>' +
            '<div id="wlPct" class="wl-pct"></div>' +
            '<button id="wlRetry" class="wl-retry" style="display:none">Retry</button>' +
            '<div id="wlHint" class="wl-hint">Click to start &middot; F toggles fullscreen</div>' +
          '</div>';
        document.body.appendChild(el);
        return el;
      }
      function webLoaderUpdate() {
        var el = document.getElementById('balatroLoader');
        if (!el) return;
        var st = document.getElementById('wlStatus');
        var fill = document.getElementById('wlFill');
        var pct = document.getElementById('wlPct');
        var retry = document.getElementById('wlRetry');
        var hint = document.getElementById('wlHint');
        var bar = el.querySelector('.wl-bar');
        if (webLoader.phase === 'start') {
          st.textContent = 'Click to Start';
          bar.style.visibility = 'hidden';
          fill.style.width = '0%';
          pct.textContent = '';
          retry.style.display = 'none';
          hint.style.display = 'block';
        } else if (webLoader.phase === 'error') {
          st.textContent = 'Download failed — check your connection.';
          bar.style.visibility = 'hidden';
          pct.textContent = '';
          retry.style.display = 'inline-block';
          hint.style.display = 'none';
        } else if (webLoader.phase === 'cache') {
          st.textContent = 'Loading game data from cache';
          bar.style.visibility = 'hidden';
          pct.textContent = '';
          retry.style.display = 'none';
          hint.style.display = 'none';
        } else {
          bar.style.visibility = 'visible';
          retry.style.display = 'none';
          hint.style.display = 'none';
          if (webLoader.total > 0) {
            var ratio = webLoader.loaded / webLoader.total;
            if (ratio < 0) ratio = 0;
            if (ratio > 1) ratio = 1;
            var p = Math.floor(ratio * 100);
            fill.style.width = p + '%';
            pct.textContent = p + '% \u00B7 ' + (webLoader.loaded / 1048576).toFixed(1) + ' / ' + (webLoader.total / 1048576).toFixed(1) + ' MB';
            st.textContent = webLoader.phase === 'preparing' ? 'Preparing\u2026' :
                             (webLoader.phase === 'complete' ? 'All downloads complete\u2026' : 'Downloading game data\u2026');
          } else {
            fill.style.width = '100%';
            pct.textContent = '';
            st.textContent = webLoader.phase === 'preparing' ? 'Preparing\u2026' : 'Starting\u2026';
          }
        }
      }
      function webLoaderSet(phase, loaded, total) {
        webLoader.phase = phase;
        if (typeof loaded === 'number') webLoader.loaded = loaded;
        if (typeof total === 'number' && total > 0) webLoader.total = total;
        webLoaderUpdate();
      }
      function webLoaderFromCache() {
        if (webLoader.fromCache !== null) return webLoader.fromCache;
        try {
          if (typeof Module === 'undefined' || !Module) return null;
          var pr = Module.preloadResults && Module.preloadResults['game.data'];
          if (pr && pr.fromCache !== undefined) {
            webLoader.fromCache = pr.fromCache;
            return webLoader.fromCache;
          }
        } catch (e) {}
        return null;
      }
      function webLoaderDataDone(notify) {
        try {
          if (typeof Module === 'undefined' || !Module) return false;
          if (Module.remainingDependencies !== 0) return false;
          if (Module.preloadResults && Module.preloadResults['game.data']) {
            if (notify) {
              webLoaderSet('complete');
              setTimeout(function () { if (!webLoader.mainStarted) webLoaderStart(); }, 80);
            }
            return true;
          }
          if (Module.finishedDataFileDownloads > 0) {
            if (notify) {
              webLoaderSet('complete');
              setTimeout(function () { if (!webLoader.mainStarted) webLoaderStart(); }, 80);
            }
            return true;
          }
        } catch (e) {}
        return false;
      }
      function webLoaderStart() {
        if (webLoader.phase === 'error') return;
        if (webLoader.mainStarted) return;
        webLoader.started = true;
        var m = (typeof Module !== 'undefined') ? Module : null;
        if (!m) { setTimeout(webLoaderStart, 100); return; }
        if (webLoaderDataDone()) {
          webLoader.mainStarted = true;
          webLoaderSet('preparing');
          webLoaderFinish();
        } else {
          var cache = webLoaderFromCache();
          if (cache === true) { webLoaderSet('cache'); }
          else { webLoaderSet('preparing'); }
          setTimeout(webLoaderStart, 200);
        }
      }
      function webLoaderFinish() {
        if (webLoader.finished) return;
        webLoader.finished = true;
        var el = document.getElementById('balatroLoader');
        if (el) {
          el.style.opacity = '0';
          setTimeout(function () {
            el.style.display = 'none';
            try { document.getElementById('canvas').style.visibility = 'visible'; } catch (e) {}
          }, 300);
        } else {
          try { document.getElementById('canvas').style.visibility = 'visible'; } catch (e) {}
        }
      }
      function webLoaderFail() { webLoaderSet('error'); }
      function webLoaderRetry() { try { window.location.reload(); } catch (e) {} }
      window.__balatroWebLoader = { fail: webLoaderFail, retry: webLoaderRetry };
      function webLoaderOnClick(e) {
        if (typeof e !== 'undefined' && e) { try { e.preventDefault(); } catch (err) {} }
        if (webLoader.phase !== 'error') { webLoaderStart(); }
        else { webLoaderRetry(); }
      }
      function webLoaderTick() {
        var el = document.getElementById('balatroLoader');
        if (!el) return;
        if (webLoader.started && webLoader.phase !== 'complete' && webLoader.phase !== 'error' && webLoader.phase !== 'start') {

            }, 80);
          }
        }
      }
      webLoaderCreate();
      document.getElementById('balatroLoader').addEventListener('click', webLoaderOnClick);
      setInterval(webLoaderTick, 250);

      window.onload = function () { window.focus(); };
      window.onclick = function () { window.focus(); };

      window.addEventListener("keydown", function(e) {
        // space and arrow keys
        if([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
          e.preventDefault();
        }
      }, false);

        var Module = {
      arguments: ["./game.data?v=76"],

          loveInstance.then(function(instance){
            if (instance) {
              Module = instance;
              window.Module = instance;
              if (instance.FS) { window.FS = instance.FS; }
            }
            afterInstance();
          }).catch(function(err){
            console.warn('Love init failed', err);
          });
        } else if (loveInstance) {
          Module = loveInstance;
          window.Module = loveInstance;
          if (loveInstance.FS) { window.FS = loveInstance.FS; }
          afterInstance();
        }
        syncCanvasSizes();
        afterInstance();
        // Initialize virtual cursor after Love.js loads
        setTimeout(function() {
          syncCanvasSizes();
          initVirtualCursor();
          ensureBalatroBridgeLoaded();
        }, 1000);
      }
  </script>

  </body>
